name: Policy Check

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  policy:
    # SanHsien fork = 上游 v1.0.18 + 可設定的 canonical agent file；上游新版由 dependency-freshness 比對。
    uses: SanHsien/paulsha-conventions/.github/workflows/reusable-policy-check.yml@cb2a6b0257da6a8819bc1c640e8265aef3b7627a  # v1.0.18
    with:
      policy_profile: flat
      policy_version: "1.0.18"
      policy_engine_ref: cb2a6b0257da6a8819bc1c640e8265aef3b7627a
      policy_engine_repo: SanHsien/paulsha-conventions
