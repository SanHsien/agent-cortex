name: Policy Check

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  policy:
    # SanHsien fork = 上游 v1.0.15 + 可設定的 canonical agent file；上游新版由 dependency-freshness 比對。
    uses: SanHsien/paulsha-conventions/.github/workflows/reusable-policy-check.yml@4e6621e92dda1538fa980ebcb4f82ea3dc9fe916  # v1.0.15
    with:
      policy_profile: flat
      policy_version: "1.0.15"
      policy_engine_ref: 4e6621e92dda1538fa980ebcb4f82ea3dc9fe916
      policy_engine_repo: SanHsien/paulsha-conventions
